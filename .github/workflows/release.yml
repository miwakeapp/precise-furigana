name: Weekly dictionary release

on:
  schedule:
    - cron: "17 3 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dictionary-release
  cancel-in-progress: false

jobs:
  release:
    # Scheduled releases run from the default branch; dispatches must do so too.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm ci
      - run: npm test
      - run: npm run fetch -- --update
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm run build
      - run: npm run validate
      - run: node scripts/release.mjs --publish
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
