name: Release

# Every release is built from a commit on the default branch, pinned inputs included. A push
# that leaves the database unchanged publishes nothing.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm ci
      - run: npm test
      - run: npm run fetch
      - run: npm run build
      # Gives the database its release version, or reports that it is already released.
      - id: stamp
        run: node scripts/release.ts --stamp
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
      - run: npm run validate
      - if: steps.stamp.outputs.publish == 'true'
        run: node scripts/release.ts --publish
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
