name: Update dictionaries

on:
  schedule:
    - cron: "17 3 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-dictionaries
  cancel-in-progress: false

env:
  BRANCH: update-dictionaries

jobs:
  # Moves the pin and reviews the result. This job reads the web, so it holds no credential that
  # can write to the repository, and nothing it leaves on its runner is trusted afterwards.
  update:
    # Scheduled runs use the default branch; dispatches must do so too.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changed: ${{ steps.update.outputs.changed }}
      # Whether the update was clean before any review, and what it then consisted of. An update
      # merges itself only when it was clean and the review left it exactly as it was.
      clean: ${{ steps.update.outputs.clean }}
      fingerprint: ${{ steps.fingerprint.outputs.value }}
    steps:
      # The whole history, so that an open update's branch can be merged with the default branch.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm ci

      - name: Build the database as it stands
        run: node scripts/update.ts baseline

      # An open pull request can hold review work, so this run continues from its branch.
      - name: Continue an open update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git fetch "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"
            git checkout --detach FETCH_HEAD
            git merge --no-edit "$GITHUB_SHA"
          fi

      - name: Move the dictionary pin
        id: update
        run: node scripts/update.ts update
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Fingerprint the update before any review
        id: fingerprint
        if: steps.update.outputs.changed == 'true'
        run: echo "value=$(sh scripts/update-fingerprint.sh data test/fixtures .cache/update/commit-message.txt)" >> "$GITHUB_OUTPUT"

      # Claude edits files in the checkout and reads the web, to look words up in dictionaries.
      # It runs when something needs resolving, and also when a clean update brings pairs that
      # are worth a look.
      - name: Ask Claude to review
        if: steps.update.outputs.changed == 'true' && steps.update.outputs.review == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            A dictionary update is ready for review. Follow "Review a dictionary update" in
            docs/maintenance.md. The report is in .cache/update/report.md.
          claude_args: |
            --max-turns 100
            --allowedTools "Read,Edit,Write,Glob,Grep,WebSearch,WebFetch,Bash(npm run build:*),Bash(npm run validate:*),Bash(npm run inspect:*),Bash(npm run compare:*),Bash(npm test:*),Bash(npm run fmt:*)"

      - name: Rebuild after the review
        if: steps.update.outputs.changed == 'true' && steps.update.outputs.review == 'true'
        run: node scripts/update.ts recheck

      # Only data crosses to the next job: the files an update may change, and the report.
      - name: Collect the update
        if: steps.update.outputs.changed == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/update"
          cp -r data "$RUNNER_TEMP/update/data"
          cp -r test/fixtures "$RUNNER_TEMP/update/fixtures"
          cp .cache/update/report.md .cache/update/commit-message.txt "$RUNNER_TEMP/update/"
      - if: steps.update.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: update
          path: ${{ runner.temp }}/update
          if-no-files-found: error
          retention-days: 7

  # Commits the update and opens its pull request, from a checkout of its own. The token that can
  # write to the repository is used only here, where nothing from the job above runs.
  propose:
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: update
          path: ${{ runner.temp }}/update
      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ secrets.UPDATE_TOKEN }}
          CLEAN: ${{ needs.update.outputs.clean }}
          FINGERPRINT: ${{ needs.update.outputs.fingerprint }}
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          update="$RUNNER_TEMP/update"
          # Taken with this checkout's own script, before any other branch is checked out.
          received="$(sh scripts/update-fingerprint.sh "$update/data" "$update/fixtures" "$update/commit-message.txt")"
          title="$(head -n 1 "$update/commit-message.txt")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The same branch and merge as the job above, with its data files laid over the result.
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            git fetch "$remote" "$BRANCH"
            git checkout -B "$BRANCH" FETCH_HEAD
            git merge --no-edit "$GITHUB_SHA"
          else
            git checkout -B "$BRANCH"
          fi
          rm -r data test/fixtures
          cp -r "$update/data" data
          cp -r "$update/fixtures" test/fixtures
          git add data test/fixtures
          git commit --file "$update/commit-message.txt"
          git push --force "$remote" "$BRANCH"
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr edit "$BRANCH" --title "$title" --body-file "$update/report.md"
          else
            gh pr create --head "$BRANCH" --title "$title" --body-file "$update/report.md"
          fi
          # Unattended only if the update was clean and is still what it was before the review.
          if [ "$CLEAN" = "true" ] && [ "$received" = "$FINGERPRINT" ]; then
            gh pr merge "$BRANCH" --auto --squash --delete-branch \
              --subject "$title" --body "$(tail -n +3 "$update/commit-message.txt")"
          else
            gh pr merge "$BRANCH" --disable-auto || true
          fi
